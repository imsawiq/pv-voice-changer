modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC-BY-NC-SA-4.0"
issueTrackerURL = "https://github.com/imsawiq/pv-voice-changer/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Plasmo Voice Voice Changer"
description = "Voice changer for Plasmo Voice: presets, custom tuning, saved profiles, self listen, a native settings UI, an API for other mods, and server-side policy with commands and shared voices."
authors = "sawiq_"
displayURL = "https://github.com/imsawiq/pv-voice-changer"
logoFile = "assets/pv-voice-changer/icon.png"

[[mixins]]
config = "pv-voice-changer.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.2]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "plasmovoice"
type = "required"
versionRange = "[${pv_dependency_version},)"
ordering = "AFTER"
side = "BOTH"
